<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto 1 - Fetch y Axios</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js" defer></script>
  <script src="./script.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="header__content">
      <div>
        <p class="eyebrow">Punto 1</p>
        <h1>Usuarios con fetch y axios</h1>
      </div>
      <button class="theme-button" id="themeButton" type="button" aria-label="Cambiar modo">
        <span id="themeIcon">☀</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Obtener usuarios</h2>
      <p>Se consulta una API publica y se muestran nombres y emails.</p>

      <div class="actions">
        <button id="fetchButton" type="button">Cargar con fetch</button>
        <button id="axiosButton" type="button">Cargar con axios</button>
        <button id="clearButton" type="button" disabled>Borrar datos</button>
      </div>

      <p class="message" id="message"></p>
      <div class="grid" id="usersList"></div>
    </section>
  </main>
  <button class="scroll-top" id="scrollTopButton" type="button" aria-label="Subir">↑</button>
</body>
</html>
