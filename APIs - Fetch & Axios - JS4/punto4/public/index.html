<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punto 4 - API local</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="header__content">
      <div>
        <p class="eyebrow">Punto 4</p>
        <h1>API local de alumnos</h1>
      </div>
      <button class="theme-button" id="themeButton" type="button" aria-label="Cambiar modo">
        <span id="themeIcon">☀</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Alumnos desde /api/alumnos</h2>
      <p>Los datos se obtienen desde una API simple creada con Node.js.</p>

      <div class="actions">
        <button id="loadButton" type="button">Cargar alumnos</button>
        <button id="clearButton" type="button" disabled>Borrar datos</button>
      </div>
      <p class="message" id="message"></p>
      <div class="grid" id="studentsList"></div>
    </section>
  </main>
  <button class="scroll-top" id="scrollTopButton" type="button" aria-label="Subir">↑</button>
</body>
</html>
