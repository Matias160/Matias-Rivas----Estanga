<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 3 - Contar Hijos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Proyecto 3 — Contar hijos del DOM</h1>

  <nav>
    <button onclick="mostrarSeccion('inicio', this)">Inicio</button>
    <button onclick="mostrarSeccion('galeria', this)">Galería</button>
    <button onclick="mostrarSeccion('calculadora', this)">Calculadora</button>
    <button onclick="mostrarSeccion('contador', this)">Contador</button>
    <button onclick="mostrarSeccion('reloj', this)">Reloj</button>

    <button id="btn-theme" title="Cambiar tema">🌙</button>
</nav>

    <!-- INICIO -->
    <div id="inicio" class="seccion">
        <h2>Inicio</h2>
        <p>Bienvenido al proyecto 3.</p>
        <p>Hacé click en cualquier sección para contar sus hijos.</p>
        <button id="contar-hijos">Contar hijos de Inicio</button>
        <button id="btnContarInicio" onclick="contarHijos('inicio', this)">Contar hijos de Inicio</button>

    </div>

    <!-- GALERIA -->
    <div id="galeria" class="seccion oculto">
        <h2>Galería</h2>
        <button onclick="agregarFoto()">Agregar foto</button>
        <button id="btnEliminarFoto" onclick="eliminarFoto()" disabled>Eliminar foto</button>
        <button id="btnContarGaleria" onclick="contarHijos('galeria', this)">Contar hijos de Galería</button>
        <div id="fotos"></div>
    </div>

    <!-- CALCULADORA -->
    <div id="calculadora" class="seccion oculto">
        <h2>Calculadora</h2>
        <input type="number" id="num1" placeholder="Número 1"/>
        <input type="number" id="num2" placeholder="Número 2"/>
        <button onclick="calcular('suma')">Sumar</button>
        <button onclick="calcular('resta')">Restar</button>
        <button id="btnContarCalculadora" onclick="contarHijos('calculadora', this)">Contar hijos de Calculadora</button>
        <p id="resultado"></p>
    </div>

    <!-- CONTADOR -->
    <div id="contador" class="seccion oculto">
        <h2>Contador</h2>
        <h3 id="numeroContador">0</h3>
        <button onclick="contar(1)">+1</button>
        <button onclick="contar(-1)">-1</button>
        <button id="btnResetContador" onclick="resetContador()" disabled>Reset</button>
        <button id="btnContarContador" onclick="contarHijos('contador', this)">Contar hijos de Contador</button>
    </div>

    <!-- RELOJ -->
    <div id="reloj" class="seccion oculto">
        <h2>Reloj</h2>
        <h3 id="horaActual">--:--:--</h3>
        <button id="btnIniciarReloj" onclick="iniciarReloj()">Iniciar</button>
        <button id="btnDetenerReloj" onclick="detenerReloj()" disabled>Detener</button>
        <button id="btnContarReloj" onclick="contarHijos('reloj', this)">Contar hijos de Reloj</button>
    </div>

    <!-- INFO HIJOS -->
    <div id="info-hijos" class="info-hijos oculto">
        <span id="texto-hijos"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
